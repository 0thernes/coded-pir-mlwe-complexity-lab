    trigonometric Lovasz theta(C_7), and complex DFT/QGTL spectra are verified to 60-digit Decimal
    precision in Python and differentially against C11 and Eshkol forward-mode dual-number AD
    (< 2e-13), while Lean 4.35.0 machine-checks the exact rational/integer moments, all-order
    Renyi Holder & TV-chi^2 bounds, cleared-denominator inequalities, finite-field rank
    certificates, 4-var/5-obj linear-subspace realizability certificates, symbolic ALL-m Koszul
    left-inverses, exact Strassen-Winograd rank_F(<2,2,2>)=7, Brockett-Dobkin 2m^2-m, and exact
    Z[sqrt(5)] SOS Lovasz Theta(C_5)=sqrt(5) + Haemers C_7 rank=4 with zero Mathlib.

