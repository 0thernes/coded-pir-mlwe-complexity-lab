    are verified to 60-digit Decimal precision in Python and differentially against C11
    and Eshkol forward-mode dual-number AD (< 2e-13), while Lean 4.35.0 machine-checks
    the exact rational/integer moments, cleared-denominator inequalities, finite-field
    rank certificates, pure-integer 12-variable polymatroid witness, and pure-integer
    {-1,0,+1} Koszul flattening left-inverses with zero Mathlib.

