project:
  name: "Koszul-Veronese Flag-Private Coded Byzantine PIR, Module-LWE Reduction Obstructions, and Complexity-Theoretic Bridges"
  description: >-
    Zero-Mathlib Lean 4.35.0 formalization of 23 headline theorems (T1a-T3h) plus
    concrete non-vacuity witnesses across three interconnected open problem frontiers:
    (Pillar I, CS-053) exterior-power Koszul-Veronese PIR strictly beating the 2026
    LFSR coded-colluding ceiling, non-vacuous Byzantine-robust capacity double-counting
    with kernel-certified F_11 rate-2/5 zero-error witness, exact flag-privacy thresholds,
    a 330-orbit 12-variable Shannon+Ingleton polymatroid barrier at 8/13 > 3/5,
    projective P^3 linear impossibility over arbitrary fields, exact algebraic Zhang-Yeung (1998)
    and infinite Matus (2007) family M_s reductions proving h_uncond defeats all M_s simultaneously,
    and symmetric M>=3 Koszul breaking E>=KT with all-M contraction;
    (Pillar II, CS-026/QC-042/CM-048) commutative-ring determinant-ideal secret independence
    refuting Luo (2026), ring-universal anti-periodic DFT cancellation (Chen 2024 Step 9) and
    universal m-twisted DFT selection rule ([propext] alone), exact FIPS 203 ML-KEM CBD2/CBD3
    moments & 4.96x Renyi-2 cliff, pure-integer Cauchy-Schwarz finite-support Renyi floor,
    universal Pearson chi^2/Hermite-4 QGTL variational Renyi-2 bridge, constant-time 1-byte
    Dyadic-256 (Var=1, 17.7x drop to 2.14 bits) and 9-bit zero-excess-kurtosis Dyadic-512
    (Var=3/2, kappa_ex=0, det(g)=1/2, 12.9x drop to 0.592 bits), and shifted-LWE QGTL
    Berry curvature, Provost-Vallee PSD, and exact Metric-Kurtosis ordering;
    and (Pillar III, CS-001/CS-004/CS-010/CS-012/CS-051) constructive multilinear-extension
    uniqueness over arbitrary fields, LWE PRF -> Natural Proofs obstruction, Katz-Trevisan
    Byzantine PIR to LDC minimum distance 2B+1 and q-query smoothness, sharp FIPS 203 Compress_1
    margin |e|<=831, Shannon (1949) finite circuit counting, field-universal Landsberg-Ottaviani
    Koszul flattening tensor rank bounds (rank_F(T_3) >= 5 and symbolic ALL-m rank_F(<m,m,m>) >= m^2+2
    plus ceiling m^2+m), and complete characteristic-free Exact Strassen-Winograd rank_F(<2,2,2>) = 7
    over EVERY SimpleField F including F_2.
  authors:
    - name: "Alexander S. Donahue"
      orcid: "0009-0006-8168-9648"
