fidelity:
  divergences: >-
    Transcendental Renyi-2/inf/Bai optimization curves, coupled FIPS 203 discrete-convolution DFRs
    (cross-verified by a 90-digit Kronecker exact interval oracle reproducing NIST Table 1 within 0.04 bits),
    trigonometric Lovasz theta(C_7), and complex DFT/QGTL spectra are computed outside Lean in Python and
    differentially against C11 and Eshkol forward-mode dual-number AD (< 2e-13), while Lean 4.35.0
    machine-checks exact rational/integer moments, all-order Renyi Holder & TV-chi^2 bounds,
    cleared-denominator inequalities, finite-field rank certificates, true vector-space span-dimension
    soundness (HasSpanDim) of matRankModP and gf2RankSparse plus the field-universal zero-error &
    exact T-privacy PIR protocol (T1k), symbolic ALL-m Koszul left-inverses, rank_F(<2,2,2>)=7,
    the substitution bound 2m^2-m, and exact Z[sqrt(5)] SOS integer form of Lovasz Theta(C_5)=sqrt(5) +
    Haemers C_7 rank=4 with zero Mathlib.

review:
  status: "self-assessed"
  notes: >-
    Not externally peer-reviewed. Machine-checked across all 6 independent Lean 4.35.0
    proof kernels via lake comparator --config comparator.json --paranoid (Lean default,
    leanchecker-paranoid, lean4lean, silent 0-error nanoda, con-leche --verified and
    con-ron --verified; 5,711 decls on the standalone Solution export), with 0 warnings, 0 proof sorries, 0 native_decide,
    2,306-decl AuditExhaustiveAxioms sweep (under module), non-degenerate NonVacuity witnesses, 11 AdversarialTests, and a live negative
    kernel-rejection gate. Kernel agreement certifies the proofs; see ERRATA.md (L02, L06, L07, S01, S02, A02, A10 superseded/closed through v5.4.0).
