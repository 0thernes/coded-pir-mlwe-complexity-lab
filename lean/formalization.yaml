project:
  name: "Koszul-Veronese Flag-Private Coded Byzantine PIR, Module-LWE Reduction Obstructions, and Complexity-Theoretic Bridges"
  description: >-
    Zero-Mathlib Lean 4.35.0 formalization of 34 theorems (T1a-T3m) plus non-degenerate
    non-vacuity witnesses (including char-2 SimpleField (Fin 2), non-degenerate concurrent/coplanar
    P^3 lines, and T1k/T2e-T2i witnesses) and 11 adversarial tests (37 audited declarations +
    2,306 TriadFrontier.* declarations swept by AuditExhaustiveAxioms.lean under Lean 4.35.0 module).
    The theorems include elementary identities, sound linear-algebraic rank certificates, a universal
    2-file N-server K-MDS flag-private PIR protocol with zero-error decoding and exact T-collusion
    privacy bijection (T1k), unconditional in-kernel constructive existence of the F_101 (6,3,3)
    rate-10/17 20/20 zero-error PIR scheme (T1l), Markus Blaser's (FOCS 1999) 5/2 m^2 - 3m matrix
    multiplication rank lower bound over every SimpleField F including F_2 (T3m), and formalizations
    of known results across three areas; none resolves a published open problem in Lean or refutes a
    published claim.
    (Pillar I, CS-053) a moment-vector annihilation identity and a Pascal-type binomial identity;
    inequalities between closed-form rate expressions; arithmetic threshold statements; a Boolean check
    of 90 tabulated F_11 matrix inverses; Boolean polymatroid checks for a tabulated 12-variable
    function h_uncond at value ratio 8/13; the classical P^3 concurrency fact over any field;
    Zhang-Yeung (1998) and Matus-type identities; in-Lean vector-space soundness (HasSpanDim) of
    matRankModP (over F_2 and F_3) and gf2RankSparse (over F_2), closing ERRATA L02 so T1i and T1j
    certify genuine vector-space span dimensions; a field-universal formalization of the linear
    flag-private PIR protocol (zero-error decoding + exact colluder-transcript bijection Psi_I, T1k);
    and unconditional in-kernel constructive existence over SimpleField (Fin 101) of the explicit
    (6,3,3) rate-10/17 > 4/7 zero-error PIR scheme certifying DecInv*M_des = I_60, Cancel*M_pure = M_mixed,
    and all 20/20 colluding-triple flag isomorphisms with zero external oracles (T1l, closing S01/A02
    completely inside all 6 Lean kernels).
    (Pillar II, CS-026/QC-042/CM-048) a diagonal-product identity (the q-ary MLWE basis has
    determinant q^m), DFT-cancellation identities over any commutative ring, and integer
    Cauchy-Schwarz, Holder, TV-chi^2, data-processing and moment certificates for tabulated noise
    weights. Renyi values, Bai et al. overheads and exact coupled FIPS 203 decryption-failure rates
    (cross-verified by a 90-digit Kronecker exact interval oracle reproducing NIST FIPS 203 Table 1
    within 0.04 bits, closing ERRATA S02) are numerical; no divergence, sampler or lattice is defined
    in Lean. mlkemCompress1 implements exact NIST FIPS 203 Eq. (4.7) and proves equivalence with +1664.
    (Pillar III, CS-001/CS-004/CS-010/CS-012/CS-051/CS-CMP-012) multilinear-extension uniqueness,
    the counting inequality of the natural-proofs argument, minimum distance 2B+1 of a
    B-error-correcting code, pigeonhole counting, tensor-rank bounds over every field including F_2
    (rank(<2,2,2>) = 7; substitution bound 2m^2-m in T3i; Markus Blaser's FOCS 1999 5/2 m^2 - 3m
    lower bound 5m^2 - 6m <= 2*r in T3m, strictly surpassing Brockett-Dobkin 2m^2 - 1 for all m >= 6
    with m=6 -> r >= 72 > 71; and tightened sandwich 5*4^k - 6*2^k <= 2*rank(<2^k,2^k,2^k>) <= 2*7^k),
    Schwartz-Zippel, the integer form of Lovasz's Theta(C_5) = sqrt(5), minimum fitting-matrix rank 4
    for C_7, and, for every self-complementary conference graph on 4k+1 vertices, alpha(G^t)^2 <= (4k+1)^t
    and alpha(G^{2m}) >= (4k+1)^m, with the hypotheses checked in Lean for P_5, P_13 and P_17.
  authors:
    - name: "Alexander S. Donahue"
      orcid: "0009-0006-8168-9648"
      email: "0_0@0thernes.art"
      affiliation: "Independent Researcher, Spokane, WA, USA"
