project:
  name: "Koszul-Veronese Flag-Private Coded Byzantine PIR, Module-LWE Reduction Obstructions, and Complexity-Theoretic Bridges"
  description: >-
    Zero-Mathlib Lean 4.35.0 formalization of 31 headline theorems (T1a-T3l) plus
    concrete non-vacuity witnesses and 7 machine-checked adversarial boundary refutations
    (34 audited declarations) across three interconnected open problem frontiers:
    (Pillar I, CS-053) exterior-power Koszul-Veronese PIR strictly beating the 2026
    LFSR coded-colluding ceiling, non-vacuous Byzantine-robust capacity double-counting
    with kernel-certified F_11 rate-2/5 zero-error witness, exact flag-privacy thresholds,
    a 330-orbit 12-variable Shannon+Ingleton polymatroid barrier at 8/13 > 3/5,
    projective P^3 linear impossibility over arbitrary fields, exact algebraic Zhang-Yeung (1998)
    and infinite Matus (2007) family M_s reductions, symmetric M>=3 Koszul contraction,
    T1i Total 4-Variable Entropic & 5-Object F_2-Linear Subspace Barrier, and T1j Single
    Z_4-Cyclic F_2^64 6-Subspace Realization matching ALL 64 subsets of {W1,W2,A1..A4} at scale 4
    (confining any converse for C(2,4,2,2) <= 3/5 to genuinely >= 7-variable storage-coupled inequalities);
    (Pillar II, CS-026/QC-042/CM-048) commutative-ring determinant-ideal secret independence
    refuting Luo (2026), ring-universal anti-periodic DFT cancellation (Chen 2024 Step 9) and
    universal m-twisted DFT selection rule ([propext] alone), exact FIPS 203 ML-KEM CBD2/CBD3
    moments & 4.96x Renyi-2 cliff, pure-integer Cauchy-Schwarz finite-support floor,
    universal all-order Renyi-(m+1) Holder floor and TV-chi^2 bridge (T2h), universal
    Pearson chi^2/Hermite-4 QGTL variational Renyi-2 bridge, T2i pure-Nat Bai et al. engine
    (Renyi-2 DPI, exact all-order tensorization, R_inf floor) + ML-KEM-1024 Discrete Gaussian
    DFR Paradox (true unit-variance Gaussian fails NIST at 2^-173.42!) + 14-bit constant-time
    Dyadic-16384-A/B (11.17x ML-KEM-1024 drop to 6.013 b / DFR 2^-174.03; 41.9x sub-1-bit
    ML-KEM-512 drop to 0.5916 b / DFR 2^-139.31);
    and (Pillar III, CS-001/CS-004/CS-010/CS-012/CS-051/CS-CMP-012) constructive multilinear
    extension uniqueness, LWE PRF -> Natural Proofs obstruction, Katz-Trevisan Byzantine PIR
    to LDC minimum distance 2B+1 and smoothness, sharp FIPS 203 Compress_1 margin |e|<=831,
    Shannon (1949) finite circuit counting, field-universal Landsberg-Ottaviani Koszul
    flattening bounds (rank_F(T_3)>=5, symbolic ALL-m rank_F(<m,m,m>)>=m^2+2), complete
    characteristic-free Exact Strassen-Winograd rank_F(<2,2,2>)=7 (T3h), field-universal
    Brockett-Dobkin (1978) rectangular & quadratic MatMul bound rank_F(<m,m,m>)>=2m^2-m (T3i),
    field-universal Haemers rank bound & exact C_7 min Haemers rank = 4 (T3j), T3k field-universal
    Multivariate Schwartz-Zippel Lemma + S_3 symmetry + Kronecker submultiplicativity + two-sided
    Strassen-Brockett-Dobkin sandwich 2*4^k - 2^k <= rank_F(<2^k,2^k,2^k>) <= 7^k, and T3l
    infinite-family zero-reals Z[sqrt(4k+1)] Paley/conference Shannon capacity Theta(G)=sqrt(4k+1)
    for EVERY k >= 1 (instantiated concretely in Lean for P_5 = C_5, P_13, and P_17).
