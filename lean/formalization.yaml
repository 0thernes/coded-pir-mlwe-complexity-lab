    id: "https://doi.org/10.1109/TIT.1979.1055985"
    type: "paper"
    relationship: "background"
    note: "Exact pentagon Shannon capacity Theta(C_5) = sqrt(5) proved with zero reals via 3-term Z[sqrt(5)] SOS in Theorem T3j."
  - title: "On some problems of Lovasz concerning the Shannon capacity of a graph"
    authors:
