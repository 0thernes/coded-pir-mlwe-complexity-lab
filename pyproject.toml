# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_backend"

[project]
name = "coded-pir-mlwe-complexity-lab"
version = "2.0.0"
description = "Zero-Mathlib Lean 4.35.0 proofs (19 theorems T1a-T3f across 6 kernels) and multi-language verification for Koszul-Veronese Byzantine PIR (CS-053), MLWE tightness & Dyadic-256 (CS-026), and Koszul tensor / complexity-barrier bridges (CS-001/CS-004/CS-012/CS-051)"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
  {name = "Alexander S. Donahue", email = "0_0@0thernes.art"}
]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
