# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_backend"

[project]
name = "coded-pir-mlwe-complexity-lab"
version = "5.1.0"
description = "Zero-Mathlib Lean 4.35.0 proofs (31 theorem bundles T1a-T3l + 9 adversarial refutations across 6 kernels + 1,330-decl Lean.collectAxioms sweep) and multi-language verification for Coded/Byzantine PIR & 6-Obj F_2^64 Realization (CS-053), MLWE Tightness & 14-Bit Dyadic-16384-A/B (CS-026), Schwartz-Zippel & Two-Sided Strassen Bounds (CS-004), and Conditional Paley/Conference Shannon Capacity Theta(G)=sqrt(4k+1) (CS-CMP-012)"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
  {name = "Alexander S. Donahue", email = "0_0@0thernes.art"}
]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
