# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_backend"

[project]
name = "coded-pir-mlwe-complexity-lab"
version = "4.0.0"
description = "Zero-Mathlib Lean 4.35.0 proofs (27 theorems T1a-T3j across 6 kernels, 3,589 decls) and multi-language verification for Coded/Byzantine PIR (CS-053), MLWE Tightness & CT Dyadic-256/512/1024-A/B Bai Security Collapse (CS-026), Brockett-Dobkin 2m^2-m & Exact Strassen-Winograd rank_F(<2,2,2>)=7 (CS-004), and Exact Lovasz Shannon Capacity Theta(C_5)=sqrt(5) & Haemers C_7 Rank=4 (CS-CMP-012)"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
  {name = "Alexander S. Donahue", email = "0_0@0thernes.art"}
]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
