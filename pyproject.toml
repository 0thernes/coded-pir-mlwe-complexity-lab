# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_backend"

[project]
name = "coded-pir-mlwe-complexity-lab"
version = "5.4.0"
description = "Zero-Mathlib Lean 4.35.0 proofs (34 theorem bundles T1a-T3m + 11 adversarial refutations across 6 kernels + 2,306-decl Lean.collectAxioms sweep) and multi-language verification for In-Kernel F_101 (6,3,3) Rate-10/17 Zero-Error PIR & Linear-Rank Soundness (CS-053), Coupled FIPS 203 MLWE Tightness & 14-Bit Dyadic-16384-A/B (CS-026), Blaser 5/2 m^2-3m Matrix Multiplication Lower Bound & Schwartz-Zippel (CS-004), and Conditional Paley/Conference Shannon Capacity Theta(G)=sqrt(4k+1) (CS-CMP-012)"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
  {name = "Alexander S. Donahue", email = "0_0@0thernes.art"}
]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
