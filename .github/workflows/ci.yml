# SPDX-License-Identifier: Apache-2.0
name: Triad Frontier CI (Informational Multi-Platform Verification)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  native-c11:
    name: Native C11 Core & Sanitizers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build & test C11 core (-std=c11 -Wall -Wextra -Wpedantic -Werror)
        shell: bash
        run: |
          make -C native clean all test
          ./native/build/triad_cli koszul 3 2 3
          ./native/build/triad_cli f11-byz
          ./native/build/triad_cli f101-t3k3
          ./native/build/triad_cli ret6-f2
          ./native/build/triad_cli renyi 2
          ./native/build/triad_cli dyadic256
          ./native/build/triad_cli dyadic512
          ./native/build/triad_cli dyadic1024a
          ./native/build/triad_cli dyadic1024b
          ./native/build/triad_cli dyadic16384a
          ./native/build/triad_cli dyadic16384b
          ./native/build/triad_cli chen 7 3
          ./native/build/triad_cli twisted 4 5 1
          ./native/build/triad_cli qgtl 2 1.023 0.25
          ./native/build/triad_cli koszul-tensor
          ./native/build/triad_cli strassen
          ./native/build/triad_cli koszul-allm 3
          ./native/build/triad_cli koszul-allm 4
          ./native/build/triad_cli lovasz-c5
          ./native/build/triad_cli c7-cap
          ./native/build/triad_cli paley-cap 13
          ./native/build/triad_cli paley-cap 17
          if ./native/build/triad_cli qgtl 99 0 0; then
            echo "ERROR: CLI failed to reject invalid args!" >&2
            exit 1
          fi
      - name: Run AddressSanitizer, UBSan & 1024-iter standalone libFuzzer smoke (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          make -C native sanitizers
          gcc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Wall -Wextra -Wpedantic -Werror -DFUZZ_STANDALONE \
            -Inative/include native/src/triad_core.c native/tests/fuzz_triad.c \
            -o /tmp/fuzz_triad_asan -lm
          /tmp/fuzz_triad_asan

  python-and-eshkol:
    name: Python 3.12 Exact Suite, Schema & Eshkol AD (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "25"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build native C11 binary for differential tests
        shell: bash
        run: make -C native all
      - name: Run Eshkol v1.3.6 forward-mode dual-number AD modules (3/3)
        shell: bash
        run: node eshkol/run_eshkol_ad.mjs
      - name: Install Python deps & run exact suite, pytest, quickstart, axiom drift, lint, citations & timestamps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pytest ruff mypy pyyaml jsonschema
          PYTHONPATH=python python python/triad_verify/pir_koszul.py
          PYTHONPATH=python python python/triad_verify/polymatroid_barrier.py
          PYTHONPATH=python python python/triad_verify/mlwe_tightness.py
          PYTHONPATH=python python python/triad_verify/complexity_triad.py
          PYTHONPATH=python python examples/quickstart_demo.py
          PYTHONPATH=python pytest tests/test_all.py -v
          python scripts/check_readme_axioms.py
          python scripts/check_citations.py
          python scripts/stamp_timestamps.py --verify
          ruff check python tests scripts examples
          mypy python/triad_verify scripts --ignore-missing-imports

  lean4-six-kernels:
    name: Zero-Mathlib Lean 4.35.0 Six-Kernel & Palomar Comparator Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap and Elan (Lean 4.35.0)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Source forbidden-token audit, --wfail build, exhaustive axiom sweep & 6-kernel replay
        working-directory: lean
        run: |
          elan show
          python3 - << 'PYEOF'
          import pathlib, re, sys
          bad = []
          for p in sorted(pathlib.Path('.').rglob('*.lean')):
              if '.lake' in p.parts or p.name in {'PalomarChallenge.lean', 'AuditExhaustiveAxioms.lean'}:
                  continue
              txt = re.sub(r'/-.*?-/', '', p.read_text(encoding='utf-8'), flags=re.S)
              for ln_no, ln in enumerate(txt.splitlines(), 1):
                  code = ln.split('--', 1)[0]
                  if re.search(r'\b(sorry|admit|native_decide|ofReduceBool|trustCompiler|implemented_by|unsafe|partial)\b|@\[extern|^\s*((private|protected|noncomputable)\s+)*axiom\b', code):
                      bad.append(f'{p}:{ln_no}: {code.strip()}')
          if bad:
              print('FORBIDDEN LEAN TOKENS:\n' + '\n'.join(bad), file=sys.stderr)
              sys.exit(1)
          print('OK: Source forbidden-token audit passed across all Lean proof modules.')
          PYEOF
          lake build --wfail
          lake env lean VerifyAxioms.lean > /tmp/ci_axioms.txt
          cat /tmp/ci_axioms.txt
          if grep -E "sorryAx|_native|Lean\.ofReduceBool|Lean\.trustCompiler" /tmp/ci_axioms.txt; then
            echo "ERROR: Forbidden axiom detected in VerifyAxioms output!" >&2
            exit 1
          fi
          diff -u --strip-trailing-cr ../results/lean_axioms.txt /tmp/ci_axioms.txt
          lake env lean AuditExhaustiveAxioms.lean
          lake env leanchecker Solution
          lake env leanchecker PalomarSolution
          lake env leanchecker-paranoid Solution
          lake env leanchecker-paranoid PalomarSolution
          lake env leanexport Solution -- TriadFrontier.Solution.prove_all_triad_theorems TriadFrontier.NonVacuity.nonvac_all_hypotheses TriadFrontier.AdversarialTests.adv_all_boundary_refutations > /tmp/Solution.export
          lake env con-leche --verified /tmp/Solution.export
          lake env con-ron --verified /tmp/Solution.export
          cat << 'EOF' > /tmp/nanoda.json
          {
            "export_file_path": "/tmp/Solution.export",
            "use_stdin": false,
            "permitted_axioms": ["propext", "Classical.choice", "Quot.sound"],
            "unpermitted_axiom_hard_error": true,
            "nat_extension": true,
            "string_extension": true
          }
          EOF
          lake env nanoda_bin /tmp/nanoda.json
          cat << 'EOF' > /tmp/NegativeTamperTest.lean
          import TriadFrontier.ComplexityTriad
          open TriadFrontier.ComplexityTriad
          theorem tampered_false_compress1 : mlkemCompress1 (1665 + 832) = 1 := by decide
          EOF
          if lake env lean /tmp/NegativeTamperTest.lean; then
            echo "ERROR: Lean kernel failed to reject tampered false theorem!" >&2
            exit 1
          fi
          echo "OK: Live negative kernel-rejection gate confirmed false theorem rejected."
          lake comparator --config comparator.json --paranoid

  white-paper-and-provenance:
    name: AMS-LaTeX White Paper, Checksums, Dual Timestamps & SLSA Provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tectonic
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Compile AMS-LaTeX preprint & verify clean-room arXiv tarball
        run: |
          mkdir -p paper/build
          (cd paper && tectonic -X compile main.tex --outdir build --keep-logs --keep-intermediates)
          if grep -E "Overfull \\\\hbox|Float too large|LaTeX Warning: Reference .* undefined|LaTeX Warning: Citation .* undefined" paper/build/main.log; then
            echo "ERROR: TeX log contains prohibited box or reference warnings!" >&2
            exit 1
          fi
          mkdir -p /tmp/arxiv_verify
          tar -xzf dist/arxiv_submission.tar.gz -C /tmp/arxiv_verify
          (cd /tmp/arxiv_verify && tectonic -X compile main.tex)
      - name: Verify SHA256SUMS, MANIFEST.sha256, dual timestamps & report-only secret audit
        run: |
          (cd data && sha256sum -c MANIFEST.sha256)
          sha256sum -c MANIFEST.sha256
          python3 scripts/stamp_timestamps.py --verify
          sha256sum dist/Donahue_2026_coded_pir_mlwe_complexity_frontier.pdf dist/arxiv_submission.tar.gz > /tmp/SHA256SUMS
          cat /tmp/SHA256SUMS
          # Report-only secret & hygiene audit (compatible with gitleaks patterns)
          ! grep -rnE "ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY" --exclude-dir=.git --exclude-dir=.lake . || true
      - name: Attest frozen PDF, arXiv tarball, Lean axioms & timestamp receipts on main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/Donahue_2026_coded_pir_mlwe_complexity_frontier.pdf
            dist/arxiv_submission.tar.gz
            MANIFEST.sha256
            results/lean_axioms.txt
            data/MANIFEST.sha256.tsr
            data/MANIFEST.sha256.ots
